name: Immutable v0.1.0 release

on:
  push:
    tags:
      - "v0.1.0"

permissions:
  contents: read

concurrency:
  group: release-v0.1.0
  cancel-in-progress: false

env:
  PROVIDER_MSRV: "1.89.0"
  PROVIDER_RUST_TOOLCHAIN: "1.97.0"
  WASM_TOOLS_VERSION: "1.236.1"
  CARGO_DENY_VERSION: "0.20.2"
  DEKOPON_RUN_VERSION: "0.11.1"
  WASMTIME_VERSION: "48.0.0"
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_LINUX_AMD64_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  ORAS_VERSION: "1.2.3"
  ORAS_LINUX_AMD64_SHA256: "b4efc97a91f471f323f193ea4b4d63d8ff443ca3aab514151a30751330852827"
  OCI_REPOSITORY: "ghcr.io/dekopon-agents/provider-ripgrep"

jobs:
  build:
    name: verify immutable source and exact component
    if: github.repository == 'dekopon-agents/dekopon-provider-ripgrep'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Check out immutable tag without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify repository, annotated tag, version, SHA, and main ancestry
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = dekopon-agents/dekopon-provider-ripgrep
          test "$GITHUB_REF_NAME" = v0.1.0
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          test "$(git rev-parse "$GITHUB_REF_NAME^{}")" = "$GITHUB_SHA"
          version=$(cargo metadata --locked --no-deps --format-version 1 |
            jq -er '.packages[] | select(.name == "dekopon-ripgrep-provider") | .version')
          test "$version" = 0.1.0
          test "$GITHUB_REF_NAME" = "v$version"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          test -z "$(git ls-files '*.wasm')"
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: Install all pinned release tools
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$PROVIDER_MSRV" --profile minimal
          rustup toolchain install "$PROVIDER_RUST_TOOLCHAIN" --profile minimal \
            --component clippy --component rustfmt
          rustup target add wasm32-unknown-unknown --toolchain "$PROVIDER_RUST_TOOLCHAIN"
          cargo +"$PROVIDER_RUST_TOOLCHAIN" install cargo-deny \
            --version "$CARGO_DENY_VERSION" --locked
          cargo +"$PROVIDER_RUST_TOOLCHAIN" install wasm-tools \
            --version "$WASM_TOOLS_VERSION" --locked
          cargo +"$PROVIDER_RUST_TOOLCHAIN" install dekopon-run \
            --version "$DEKOPON_RUN_VERSION" --locked
          cargo +"$PROVIDER_RUST_TOOLCHAIN" install wasmtime-cli \
            --version "$WASMTIME_VERSION" --locked
          sudo apt-get update
          sudo apt-get install --yes ripgrep shellcheck ruby
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "$ACTIONLINT_LINUX_AMD64_SHA256  $RUNNER_TEMP/$archive" | \
            sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          sudo install -m 0755 "$RUNNER_TEMP/actionlint" /usr/local/bin/actionlint
      - name: Run every source, component, host, testkit, resource, and license gate
        run: ./scripts/validate.sh
      - name: Require two additional clean pinned builds to be byte-identical
        run: ./scripts/reproducible-build.sh
      - name: Verify exact release asset layout
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/verify-release-assets.sh "$PWD/dist"
          test "$(find dist -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 2
      - name: Upload exact two-file release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7

  attest:
    name: attest component and checksum
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download exact release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - name: Verify candidate shape and checksum
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 2
          (cd dist && sha256sum --check --strict ripgrep-provider.wasm.sha256)
      - name: Attest both immutable release files
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*

  draft:
    name: create and verify run-owned exact draft
    needs: [build, attest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: read
      id-token: write
      packages: read
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      marker: ${{ steps.create.outputs.marker }}
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out verification scripts without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download exact release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - name: Install pinned component validator
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$PROVIDER_RUST_TOOLCHAIN" --profile minimal
          cargo +"$PROVIDER_RUST_TOOLCHAIN" install wasm-tools \
            --version "$WASM_TOOLS_VERSION" --locked
      - name: Verify assets and both attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/verify-release-assets.sh "$PWD/dist"
          gh attestation verify dist/ripgrep-provider.wasm --repo "$GITHUB_REPOSITORY"
          gh attestation verify dist/ripgrep-provider.wasm.sha256 --repo "$GITHUB_REPOSITORY"
      - name: Prove the release and entire final GHCR package are absent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.1.0" \
            >"$RUNNER_TEMP/existing-release.json" 2>"$RUNNER_TEMP/release.err"; then
            echo "error: immutable v0.1.0 release already exists" >&2
            exit 1
          fi
          grep -Eqi 'not found|404' "$RUNNER_TEMP/release.err"
          if gh api /orgs/dekopon-agents/packages/container/provider-ripgrep \
            >"$RUNNER_TEMP/existing-package.json" 2>"$RUNNER_TEMP/package.err"; then
            echo "error: final provider-ripgrep package already exists" >&2
            exit 1
          fi
          grep -Eqi 'not found|404' "$RUNNER_TEMP/package.err"
      - name: Create a run-marked draft with exactly two assets
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          marker="provider-ripgrep-run:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
          printf '%s\n\nAwaiting verified OCI manifest before finalization.\n' "$marker" \
            >"$RUNNER_TEMP/draft-notes.md"
          gh release create v0.1.0 --verify-tag --draft --title v0.1.0 \
            --notes-file "$RUNNER_TEMP/draft-notes.md" \
            dist/ripgrep-provider.wasm dist/ripgrep-provider.wasm.sha256
          release_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -ser --arg marker "$marker" '
              [.[][] | select(
                .draft == true and .tag_name == "v0.1.0" and
                ((.body // "") | startswith($marker))
              )] |
              if length == 1 then .[0].id else error("run-owned draft cardinality") end
            ')
          test "$release_id" -gt 0
          echo "release_id=$release_id" >>"$GITHUB_OUTPUT"
          echo "marker=$marker" >>"$GITHUB_OUTPUT"
      - name: Redownload both draft assets by ID and compare bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.create.outputs.release_id }}
          MARKER: ${{ steps.create.outputs.marker }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" >"$RUNNER_TEMP/draft.json"
          jq -e --arg marker "$MARKER" '
            .draft == true and .tag_name == "v0.1.0" and
            ((.body // "") | startswith($marker)) and
            ([.assets[].name] | sort) ==
              ["ripgrep-provider.wasm", "ripgrep-provider.wasm.sha256"]
          ' "$RUNNER_TEMP/draft.json" >/dev/null
          mkdir "$RUNNER_TEMP/draft-assets"
          for name in ripgrep-provider.wasm ripgrep-provider.wasm.sha256; do
            asset_id=$(jq -er --arg name "$name" '
              [.assets[] | select(.name == $name)] |
              if length == 1 then .[0].id else error("asset cardinality") end
            ' "$RUNNER_TEMP/draft.json")
            gh api -H 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              >"$RUNNER_TEMP/draft-assets/$name"
            cmp "dist/$name" "$RUNNER_TEMP/draft-assets/$name"
          done
          ./scripts/verify-release-assets.sh "$RUNNER_TEMP/draft-assets"

  ghcr:
    name: publish direct-final one-layer GHCR artifact and verify anonymously
    needs: [build, draft]
    runs-on: ubuntu-24.04
    permissions:
      # Draft releases are visible to this job only with writable contents access.
      contents: write
      packages: write
    outputs:
      manifest_digest: ${{ steps.publish.outputs.manifest_digest }}
    steps:
      - name: Check out manifest verifier without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download exact release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - name: Install pinned ORAS from its verified archive
        shell: bash
        run: |
          set -euo pipefail
          archive="oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "$ORAS_LINUX_AMD64_SHA256  $RUNNER_TEMP/$archive" | \
            sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" oras
          install -m 0755 "$RUNNER_TEMP/oras" "$RUNNER_TEMP/oras-bin"
          (cd dist && sha256sum --check --strict ripgrep-provider.wasm.sha256)
      - name: Authenticate only for the final push
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push only 0.1.0, verify manifest, make public, and pull anonymously
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
          MARKER: ${{ needs.draft.outputs.marker }}
        shell: bash
        run: |
          set -euo pipefail
          test "$VERSION" = 0.1.0
          run="$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
          ref="$OCI_REPOSITORY:$VERSION"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" >"$RUNNER_TEMP/owned-draft.json"
          jq -e --arg marker "$MARKER" '
            .draft == true and .tag_name == "v0.1.0" and
            ((.body // "") | startswith($marker))
          ' "$RUNNER_TEMP/owned-draft.json" >/dev/null
          if "$RUNNER_TEMP/oras-bin" manifest fetch --descriptor "$ref" \
            >"$RUNNER_TEMP/existing.json" 2>"$RUNNER_TEMP/existing.err"; then
            echo "error: immutable final OCI reference already exists" >&2
            exit 1
          fi
          grep -Eqi 'not found|manifest unknown|MANIFEST_UNKNOWN|404' "$RUNNER_TEMP/existing.err"
          # Push from dist so the OCI layer title is the asset basename, not a workspace path.
          (
            cd dist
            "$RUNNER_TEMP/oras-bin" push "$ref" \
              --artifact-type application/vnd.dekopon.provider.v1+wasm \
              --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --annotation "org.opencontainers.image.version=$VERSION" \
              --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
              --annotation "org.opencontainers.image.licenses=(MIT OR Apache-2.0) AND BSD-3-Clause" \
              --annotation "org.dekopon.distribution.notices=embedded:dekopon.third-party-notices" \
              --annotation "org.dekopon.release.run=$run" \
              --annotation "org.dekopon.release.url=https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION" \
              --annotation "org.dekopon.provider.capability=ripgrep.search" \
              ripgrep-provider.wasm:application/wasm
          )
          digest=$("$RUNNER_TEMP/oras-bin" manifest fetch --descriptor "$ref" | jq -er .digest)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "manifest_digest=$digest" >>"$GITHUB_OUTPUT"
          "$RUNNER_TEMP/oras-bin" manifest fetch "$OCI_REPOSITORY@$digest" \
            >"$RUNNER_TEMP/authenticated-manifest.json"
          ./scripts/verify-oci-manifest.py "$RUNNER_TEMP/authenticated-manifest.json" \
            dist/ripgrep-provider.wasm "$run" "$GITHUB_SHA"

          for _ in {1..30}; do
            visibility=$(gh api /orgs/dekopon-agents/packages/container/provider-ripgrep \
              --jq .visibility 2>/dev/null || true)
            if [[ "$visibility" == public ]]; then break; fi
            if [[ "$visibility" == private ]]; then
              gh api --method PATCH \
                /orgs/dekopon-agents/packages/container/provider-ripgrep \
                -f visibility=public >/dev/null
            fi
            sleep 2
          done
          test "$(gh api /orgs/dekopon-agents/packages/container/provider-ripgrep --jq .visibility)" = public

          docker logout ghcr.io
          anonymous=(env -u GH_TOKEN -u GITHUB_TOKEN "$RUNNER_TEMP/oras-bin")
          test "$("${anonymous[@]}" manifest fetch --descriptor "$ref" | jq -er .digest)" = "$digest"
          "${anonymous[@]}" manifest fetch "$ref" >"$RUNNER_TEMP/anonymous-manifest.json"
          ./scripts/verify-oci-manifest.py "$RUNNER_TEMP/anonymous-manifest.json" \
            dist/ripgrep-provider.wasm "$run" "$GITHUB_SHA"
          mkdir "$RUNNER_TEMP/anonymous-pull"
          "${anonymous[@]}" pull "$ref" --output "$RUNNER_TEMP/anonymous-pull"
          test "$(find "$RUNNER_TEMP/anonymous-pull" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 1
          cmp dist/ripgrep-provider.wasm "$RUNNER_TEMP/anonymous-pull/ripgrep-provider.wasm"
          expected=$(awk '{print $1}' dist/ripgrep-provider.wasm.sha256)
          test "sha256:$expected" = "$(jq -er '.layers[0].digest' "$RUNNER_TEMP/anonymous-manifest.json")"

          gh api --paginate \
            /orgs/dekopon-agents/packages/container/provider-ripgrep/versions?per_page=100 \
            >"$RUNNER_TEMP/versions.jsons"
          jq -se --arg digest "$digest" '
            [.[][]] as $versions |
            ($versions | length) == 1 and
            $versions[0].name == $digest and
            (($versions[0].metadata.container.tags // []) | sort) == ["0.1.0"]
          ' "$RUNNER_TEMP/versions.jsons" >/dev/null

  finalize:
    name: verify public bytes and finalize release as the last mutation
    needs: [build, draft, ghcr]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out verification scripts without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download exact release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - name: Install pinned ORAS and component validator
        shell: bash
        run: |
          set -euo pipefail
          archive="oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "$ORAS_LINUX_AMD64_SHA256  $RUNNER_TEMP/$archive" | \
            sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" oras
          rustup toolchain install "$PROVIDER_RUST_TOOLCHAIN" --profile minimal
          cargo +"$PROVIDER_RUST_TOOLCHAIN" install wasm-tools \
            --version "$WASM_TOOLS_VERSION" --locked
      - name: Recheck draft assets and every anonymous OCI byte, then finalize
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
          MARKER: ${{ needs.draft.outputs.marker }}
          MANIFEST_DIGEST: ${{ needs.ghcr.outputs.manifest_digest }}
        shell: bash
        run: |
          set -euo pipefail
          test "$VERSION" = 0.1.0
          [[ "$MANIFEST_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          run="$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
          ref="$OCI_REPOSITORY:$VERSION"
          ./scripts/verify-release-assets.sh "$PWD/dist"

          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" >"$RUNNER_TEMP/final-draft.json"
          jq -e --arg marker "$MARKER" '
            .draft == true and .tag_name == "v0.1.0" and
            ((.body // "") | startswith($marker)) and
            ([.assets[].name] | sort) ==
              ["ripgrep-provider.wasm", "ripgrep-provider.wasm.sha256"]
          ' "$RUNNER_TEMP/final-draft.json" >/dev/null
          mkdir "$RUNNER_TEMP/final-draft-assets"
          for name in ripgrep-provider.wasm ripgrep-provider.wasm.sha256; do
            asset_id=$(jq -er --arg name "$name" '
              [.assets[] | select(.name == $name)] |
              if length == 1 then .[0].id else error("asset cardinality") end
            ' "$RUNNER_TEMP/final-draft.json")
            gh api -H 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              >"$RUNNER_TEMP/final-draft-assets/$name"
            cmp "dist/$name" "$RUNNER_TEMP/final-draft-assets/$name"
          done
          ./scripts/verify-release-assets.sh "$RUNNER_TEMP/final-draft-assets"

          anonymous=(env -u GH_TOKEN -u GITHUB_TOKEN "$RUNNER_TEMP/oras")
          test "$("${anonymous[@]}" manifest fetch --descriptor "$ref" | jq -er .digest)" = "$MANIFEST_DIGEST"
          "${anonymous[@]}" manifest fetch "$ref" >"$RUNNER_TEMP/final-manifest.json"
          ./scripts/verify-oci-manifest.py "$RUNNER_TEMP/final-manifest.json" \
            dist/ripgrep-provider.wasm "$run" "$GITHUB_SHA"
          mkdir "$RUNNER_TEMP/final-pull"
          "${anonymous[@]}" pull "$ref" --output "$RUNNER_TEMP/final-pull"
          test "$(find "$RUNNER_TEMP/final-pull" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 1
          cmp dist/ripgrep-provider.wasm "$RUNNER_TEMP/final-pull/ripgrep-provider.wasm"

          cat >"$RUNNER_TEMP/release-notes.md" <<EOF
          $MARKER

          Import-free bounded search over caller-fed UTF-8 virtual documents. OCI manifest:
          \`$OCI_REPOSITORY@$MANIFEST_DIGEST\` (tag \`0.1.0\`). The anonymous OCI layer is byte-identical
          to \`ripgrep-provider.wasm\`; verify it with the attached SHA-256 file.

          Limitations: no filesystem/path discovery, directories, globs, types, ignore files,
          encodings/transcoding, mmap, network, replacement, archives, config files, command words,
          PCRE2, or full rg CLI compatibility. Duplicate JSON object names use serde_json's
          last-value-wins behavior. Host wire limits are separate from decoded provider limits.
          No latest or temporary tag is published. The binary distribution license expression is
          **(MIT OR Apache-2.0) AND BSD-3-Clause**.
          EOF
          "$GITHUB_WORKSPACE/scripts/embed-license-bundle.py" write \
            "$RUNNER_TEMP/license-bundle.txt" "$GITHUB_WORKSPACE"
          {
            printf '\n## Complete distribution license bundle\n\n'
            cat "$RUNNER_TEMP/license-bundle.txt"
          } >>"$RUNNER_TEMP/release-notes.md"
          "$GITHUB_WORKSPACE/scripts/embed-license-bundle.py" verify-text \
            "$RUNNER_TEMP/release-notes.md" "$GITHUB_WORKSPACE"
          test "$(wc -c <"$RUNNER_TEMP/release-notes.md")" -le 125000
          jq -n --rawfile body "$RUNNER_TEMP/release-notes.md" '{
            draft: false,
            prerelease: false,
            name: "v0.1.0",
            body: $body
          }' >"$RUNNER_TEMP/publish.json"

          # This PATCH is the release transaction's final mutation. Everything above is read-only.
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --input "$RUNNER_TEMP/publish.json" >"$RUNNER_TEMP/published.json"
          jq -e --arg marker "$MARKER" '
            .draft == false and .tag_name == "v0.1.0" and
            ((.body // "") | startswith($marker))
          ' "$RUNNER_TEMP/published.json" >/dev/null

  cleanup_failed_release:
    name: remove only this failed run's proven draft and sole final manifest
    if: ${{ always() && needs.finalize.result != 'success' }}
    needs: [build, draft, ghcr, finalize]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Install pinned ORAS
        shell: bash
        run: |
          set -euo pipefail
          archive="oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "$ORAS_LINUX_AMD64_SHA256  $RUNNER_TEMP/$archive" | \
            sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" oras
      - name: Authenticate for narrowly verified cleanup
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify run ownership and remove OCI effect before draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
          MARKER: ${{ needs.draft.outputs.marker }}
          EXPECTED_DIGEST: ${{ needs.ghcr.outputs.manifest_digest }}
        shell: bash
        run: |
          set -euo pipefail
          run="$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
          expected_marker="provider-ripgrep-run:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
          [[ -z "$MARKER" || "$MARKER" == "$expected_marker" ]]
          [[ -z "$EXPECTED_DIGEST" || "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

          release_id=$RELEASE_ID
          release_owned=false
          release_draft=false
          if [[ -n "$release_id" ]]; then
            [[ "$release_id" =~ ^[0-9]+$ ]]
            endpoint="repos/$GITHUB_REPOSITORY/releases/$release_id"
          else
            endpoint="repos/$GITHUB_REPOSITORY/releases?per_page=100"
          fi
          if [[ -n "$release_id" ]]; then
            gh api "$endpoint" >"$RUNNER_TEMP/release.json" 2>"$RUNNER_TEMP/release.err" || true
          else
            gh api --paginate "$endpoint" | jq -s 'add' >"$RUNNER_TEMP/releases.json"
            jq --arg marker "$expected_marker" '
              [.[] | select(
                .tag_name == "v0.1.0" and ((.body // "") | startswith($marker))
              )] |
              if length == 1 then .[0] elif length == 0 then null
              else error("multiple run-owned releases") end
            ' "$RUNNER_TEMP/releases.json" >"$RUNNER_TEMP/release.json"
          fi
          if jq -e --arg marker "$expected_marker" '
            . != null and .tag_name == "v0.1.0" and
            ((.body // "") | startswith($marker))
          ' "$RUNNER_TEMP/release.json" >/dev/null 2>&1; then
            release_owned=true
            release_id=$(jq -er .id "$RUNNER_TEMP/release.json")
            if jq -e '.draft == false' "$RUNNER_TEMP/release.json" >/dev/null; then
              echo "preserving finalized immutable release and linked OCI artifact" >&2
              exit 0
            fi
            jq -e '.draft == true' "$RUNNER_TEMP/release.json" >/dev/null
            release_draft=true
          fi

          ref="$OCI_REPOSITORY:0.1.0"
          digest=
          if descriptor=$("$RUNNER_TEMP/oras" manifest fetch --descriptor "$ref" \
            2>"$RUNNER_TEMP/descriptor.err"); then
            digest=$(jq -er .digest <<<"$descriptor")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ -z "$EXPECTED_DIGEST" || "$digest" == "$EXPECTED_DIGEST" ]]
            "$RUNNER_TEMP/oras" manifest fetch "$OCI_REPOSITORY@$digest" \
              >"$RUNNER_TEMP/owned-manifest.json"
            jq -e --arg run "$run" --arg revision "$GITHUB_SHA" '
              .artifactType == "application/vnd.dekopon.provider.v1+wasm" and
              .annotations["org.dekopon.release.run"] == $run and
              .annotations["org.opencontainers.image.source"] ==
                "https://github.com/dekopon-agents/dekopon-provider-ripgrep" and
              .annotations["org.opencontainers.image.version"] == "0.1.0" and
              .annotations["org.opencontainers.image.revision"] == $revision and
              .annotations["org.opencontainers.image.licenses"] ==
                "(MIT OR Apache-2.0) AND BSD-3-Clause" and
              .annotations["org.dekopon.distribution.notices"] ==
                "embedded:dekopon.third-party-notices" and
              (.layers | length) == 1 and .layers[0].mediaType == "application/wasm"
            ' "$RUNNER_TEMP/owned-manifest.json" >/dev/null

            gh api --paginate \
              /orgs/dekopon-agents/packages/container/provider-ripgrep/versions?per_page=100 \
              >"$RUNNER_TEMP/cleanup-versions.jsons"
            version_id=$(jq -ser --arg digest "$digest" '
              [.[][]] as $versions |
              if ($versions | length) == 1 and
                 $versions[0].name == $digest and
                 (($versions[0].metadata.container.tags // []) | sort) == ["0.1.0"]
              then $versions[0].id
              else error("manifest is missing, shared, or has another tag/version") end
            ' "$RUNNER_TEMP/cleanup-versions.jsons")
            [[ "$version_id" =~ ^[0-9]+$ ]]
            gh api --method DELETE \
              "/orgs/dekopon-agents/packages/container/provider-ripgrep/versions/$version_id"
            if "$RUNNER_TEMP/oras" manifest fetch --descriptor "$ref" \
              >/dev/null 2>"$RUNNER_TEMP/deleted.err"; then
              echo "error: run-owned final OCI reference survived cleanup" >&2
              exit 1
            fi
            grep -Eqi 'not found|manifest unknown|MANIFEST_UNKNOWN|404' "$RUNNER_TEMP/deleted.err"
          elif ! grep -Eqi 'not found|manifest unknown|MANIFEST_UNKNOWN|404' \
            "$RUNNER_TEMP/descriptor.err"; then
            cat "$RUNNER_TEMP/descriptor.err" >&2
            exit 1
          fi

          if [[ "$release_owned" == true && "$release_draft" == true ]]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
          fi
