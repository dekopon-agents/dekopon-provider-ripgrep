      - name: Verify both strict source-run provenance attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$TAG"
          invocation="https://github.com/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/attempts/1"
          for name in ripgrep-provider.wasm ripgrep-provider.wasm.sha256; do
            case "$name" in
              ripgrep-provider.wasm) digest=$COMPONENT_SHA256 ;;
              ripgrep-provider.wasm.sha256) digest=$CHECKSUM_SHA256 ;;
              *) exit 1 ;;
            esac
            gh attestation verify "dist/$name" \
              --repo "$GITHUB_REPOSITORY" \
              --cert-identity "$identity" \
              --signer-digest "$SOURCE_SHA" \
              --source-digest "$SOURCE_SHA" \
              --source-ref "refs/tags/$TAG" \
              --deny-self-hosted-runners \
              --format json >"$RUNNER_TEMP/$name.attestation.json"
