name: Finalize exact residual v0.1.0 release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finalize-exact-residual-v0.1.0
  cancel-in-progress: false

env:
  VERSION: "0.1.0"
  TAG: "v0.1.0"
  CONTROL_BASE_SHA: "8556da5846f25ad6f2a3a5cbe2b190443c9dc86b"
  SOURCE_SHA: "8bf0ba18f9240d5924d008d09283a5cd7c879f84"
  TAG_OBJECT_SHA: "55e3a18f84d26ac2bec86c06320bc5af1b39a77f"
  SOURCE_RUN_ID: "32733258088"
  SOURCE_WORKFLOW_ID: "341240238"
  SOURCE_BUILD_JOB_ID: "97450107488"
  SOURCE_ATTEST_JOB_ID: "97456266494"
  SOURCE_DRAFT_JOB_ID: "97458186871"
  SOURCE_GHCR_JOB_ID: "97459261430"
  SOURCE_CLEANUP_JOB_ID: "97459322540"
  SOURCE_FINALIZE_JOB_ID: "97459342491"
  SOURCE_ARTIFACT_ID: "9522912673"
  SOURCE_ARTIFACT_NAME: "release-assets"
  SOURCE_ARTIFACT_ARCHIVE_DIGEST: "sha256:048a291a23288c083790aa1881119a70d4d4efb53b95b7d181c979a86cae2d23"
  SOURCE_ARTIFACT_ARCHIVE_SIZE: "644173"
  PRIOR_RUN_ID: "32740154322"
  PRIOR_WORKFLOW_ID: "341300048"
  PRIOR_PREFLIGHT_JOB_ID: "97472417477"
  PRIOR_DRAFT_JOB_ID: "97473253702"
  PRIOR_PUBLISH_JOB_ID: "97473312024"
  PRIOR_CLEANUP_JOB_ID: "97473384617"
  PRIOR_FINALIZE_JOB_ID: "97473386091"
  PRIOR_VERIFY_FINAL_JOB_ID: "97473386526"
  PRIOR_MARKER: "provider-ripgrep-recovery-run:32740154322:1"
  DRAFT_RELEASE_ID: "375773607"
  DRAFT_COMPONENT_ASSET_ID: "527740347"
  DRAFT_CHECKSUM_ASSET_ID: "527740350"
  PACKAGE_ID: "14621604"
  PACKAGE_VERSION_ID: "1166057577"
  MANIFEST_DIGEST: "sha256:6e2e29d13541c8d5e16e4fcf238d429c1f7f7db6db1d7b2e35aec3ff3ee61142"
  MANIFEST_SIZE: "1159"
  MANIFEST_CREATED: "2026-08-24T14:43:16Z"
  COMPONENT_DIGEST: "sha256:27dfe89eafafca7039e9191e3211ce05ebe7e650b309905a294ba937d130aa0b"
  COMPONENT_SHA256: "27dfe89eafafca7039e9191e3211ce05ebe7e650b309905a294ba937d130aa0b"
  CHECKSUM_DIGEST: "sha256:cdb323c2ec550e1d463d19091d3ca2512ac878e7f02a293195d1297daeccce5c"
  CHECKSUM_SHA256: "cdb323c2ec550e1d463d19091d3ca2512ac878e7f02a293195d1297daeccce5c"
  COMPONENT_SIZE: "1670240"
  CHECKSUM_SIZE: "88"
  REPOSITORY_ID: "1344962391"
  OWNER_ID: "309572726"
  DISPATCH_ACTOR_ID: "693059"
  ACTIONS_BOT_ID: "41898282"
  PROVIDER_RUST_TOOLCHAIN: "1.97.0"
  WASM_TOOLS_VERSION: "1.236.1"
  DEKOPON_RUN_VERSION: "0.11.1"
  ORAS_VERSION: "1.2.3"
  ORAS_LINUX_AMD64_SHA256: "b4efc97a91f471f323f193ea4b4d63d8ff443ca3aab514151a30751330852827"
  OCI_REPOSITORY: "ghcr.io/dekopon-agents/provider-ripgrep"

jobs:
  finalize:
    name: prove the exact residual transaction and finalize its existing draft
    if: github.repository == 'dekopon-agents/dekopon-provider-ripgrep'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: read
      contents: write
      packages: read
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out the dispatched main control commit without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          path: control
      - name: Check out only the immutable tagged source without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: 8bf0ba18f9240d5924d008d09283a5cd7c879f84
          path: source
      - name: Prove repository, one-commit control context, and annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = dekopon-agents/dekopon-provider-ripgrep
          test "$GITHUB_REPOSITORY_ID" = "$REPOSITORY_ID"
          test "$GITHUB_REPOSITORY_OWNER" = dekopon-agents
          test "$GITHUB_REPOSITORY_OWNER_ID" = "$OWNER_ID"
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REF_NAME" = main
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_ACTOR" = xrl
          test "$GITHUB_ACTOR_ID" = "$DISPATCH_ACTOR_ID"
          test "$GITHUB_TRIGGERING_ACTOR" = xrl
          test "$GITHUB_WORKFLOW_REF" = \
            "dekopon-agents/dekopon-provider-ripgrep/.github/workflows/recover-v0.1.0.yml@refs/heads/main"

          test "$(git -C control rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C control rev-parse HEAD^)" = "$CONTROL_BASE_SHA"
          test "$(git -C control rev-list --count "$CONTROL_BASE_SHA..$GITHUB_SHA")" = 1
          read -r -a parents <<<"$(git -C control rev-list --parents -n 1 "$GITHUB_SHA")"
          test "${#parents[@]}" -eq 2
          test "${parents[1]}" = "$CONTROL_BASE_SHA"
          mapfile -t changed < <(
            git -C control diff --name-only "$CONTROL_BASE_SHA" "$GITHUB_SHA" | LC_ALL=C sort
          )
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = .github/workflows/recover-v0.1.0.yml
          test "${changed[1]}" = .github/workflows/release.yml
          test "${changed[2]}" = scripts/validate-workflows.sh
          git -C control diff --check "$CONTROL_BASE_SHA" "$GITHUB_SHA"
          control/scripts/validate-workflows.sh
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git -C source ls-files '*.wasm')"

          gh api "repos/$GITHUB_REPOSITORY" >"$RUNNER_TEMP/repository.json"
          jq -e --argjson repository "$REPOSITORY_ID" --argjson owner "$OWNER_ID" '
            .id == $repository and .node_id == "R_kgDOUCp_Vw" and
            .name == "dekopon-provider-ripgrep" and
            .full_name == "dekopon-agents/dekopon-provider-ripgrep" and
            .private == false and .visibility == "public" and .default_branch == "main" and
            .owner.id == $owner and .owner.node_id == "O_kgDOEnO0dg" and
            .owner.login == "dekopon-agents" and .owner.type == "Organization"
          ' "$RUNNER_TEMP/repository.json" >/dev/null
          gh api orgs/dekopon-agents >"$RUNNER_TEMP/organization.json"
          jq -e --argjson owner "$OWNER_ID" '
            .id == $owner and .node_id == "O_kgDOEnO0dg" and
            .login == "dekopon-agents" and .type == "Organization"
          ' "$RUNNER_TEMP/organization.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" >"$RUNNER_TEMP/main-ref.json"
          jq -e --arg control "$GITHUB_SHA" '
            .ref == "refs/heads/main" and .object.type == "commit" and .object.sha == $control
          ' "$RUNNER_TEMP/main-ref.json" >/dev/null

          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >"$RUNNER_TEMP/tag-ref.json"
          jq -e --arg object "$TAG_OBJECT_SHA" '
            .ref == "refs/tags/v0.1.0" and .object.type == "tag" and .object.sha == $object
          ' "$RUNNER_TEMP/tag-ref.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT_SHA" >"$RUNNER_TEMP/tag.json"
          jq -e --arg object "$TAG_OBJECT_SHA" --arg source "$SOURCE_SHA" '
            .sha == $object and .tag == "v0.1.0" and
            .object.type == "commit" and .object.sha == $source and
            .message == "dekopon-provider-ripgrep v0.1.0\n"
          ' "$RUNNER_TEMP/tag.json" >/dev/null
          version=$(cargo metadata --locked --no-deps --format-version 1 \
            --manifest-path source/Cargo.toml |
            jq -er '[.packages[] | select(.name == "dekopon-ripgrep-provider") | .version] |
              if length == 1 then .[0] else error("provider package cardinality") end')
          test "$version" = "$VERSION"
          test "$TAG" = "v$version"
      - name: Prove the exact tagged source run and all source jobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" \
            >"$RUNNER_TEMP/source-run.json"
          jq -e \
            --argjson run "$SOURCE_RUN_ID" \
            --argjson workflow "$SOURCE_WORKFLOW_ID" \
            --argjson repository "$REPOSITORY_ID" \
            --argjson actor "$DISPATCH_ACTOR_ID" \
            --arg source "$SOURCE_SHA" '
            .id == $run and .run_attempt == 1 and .workflow_id == $workflow and
            .path == ".github/workflows/release.yml" and
            .name == "Immutable v0.1.0 release" and
            .event == "push" and .status == "completed" and .conclusion == "failure" and
            .head_branch == "v0.1.0" and .head_sha == $source and .head_commit.id == $source and
            .actor.id == $actor and .actor.login == "xrl" and
            .triggering_actor.id == $actor and .triggering_actor.login == "xrl" and
            .repository.id == $repository and
            .repository.full_name == "dekopon-agents/dekopon-provider-ripgrep" and
            .head_repository.id == $repository and
            .head_repository.full_name == "dekopon-agents/dekopon-provider-ripgrep"
          ' "$RUNNER_TEMP/source-run.json" >/dev/null

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100" \
            >"$RUNNER_TEMP/source-jobs.json"
          jq -e \
            --argjson build "$SOURCE_BUILD_JOB_ID" \
            --argjson attest "$SOURCE_ATTEST_JOB_ID" \
            --argjson draft "$SOURCE_DRAFT_JOB_ID" \
            --argjson ghcr "$SOURCE_GHCR_JOB_ID" \
            --argjson cleanup "$SOURCE_CLEANUP_JOB_ID" \
            --argjson finalize "$SOURCE_FINALIZE_JOB_ID" '
            .total_count == 6 and (.jobs | length) == 6 and
            ([.jobs[] | {id, name, status, conclusion}] | sort_by(.id)) == ([
              {id:$build, name:"verify immutable source and exact component",
                status:"completed", conclusion:"success"},
              {id:$attest, name:"attest component and checksum",
                status:"completed", conclusion:"success"},
              {id:$draft, name:"create and verify run-owned exact draft",
                status:"completed", conclusion:"success"},
              {id:$ghcr, name:"publish direct-final one-layer GHCR artifact and verify anonymously",
                status:"completed", conclusion:"failure"},
              {id:$cleanup, name:"remove only this failed run\u0027s proven draft and sole final manifest",
                status:"completed", conclusion:"success"},
              {id:$finalize, name:"verify public bytes and finalize release as the last mutation",
                status:"completed", conclusion:"skipped"}
            ] | sort_by(.id))
          ' "$RUNNER_TEMP/source-jobs.json" >/dev/null

          verify_source_job() {
            local id=$1 name=$2 output=$3
            gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$id" >"$output"
            jq -e --argjson id "$id" --argjson run "$SOURCE_RUN_ID" \
              --arg source "$SOURCE_SHA" --arg name "$name" '
              .id == $id and .run_id == $run and .run_attempt == 1 and
              .head_sha == $source and .workflow_name == "Immutable v0.1.0 release" and
              .name == $name and .status == "completed" and .conclusion == "success" and
              .runner_group_name == "GitHub Actions" and .labels == ["ubuntu-24.04"]
            ' "$output" >/dev/null
          }
          verify_source_job "$SOURCE_BUILD_JOB_ID" \
            "verify immutable source and exact component" "$RUNNER_TEMP/source-build-job.json"
          verify_source_job "$SOURCE_ATTEST_JOB_ID" \
            "attest component and checksum" "$RUNNER_TEMP/source-attest-job.json"
          jq -e '
            ([.steps[] | select(.name == "Upload exact two-file release candidate" and
              .status == "completed" and .conclusion == "success")] | length) == 1
          ' "$RUNNER_TEMP/source-build-job.json" >/dev/null
          jq -e '
            ([.steps[] | select(.name == "Attest both immutable release files" and
              .status == "completed" and .conclusion == "success")] | length) == 1
          ' "$RUNNER_TEMP/source-attest-job.json" >/dev/null
      - name: Prove the exact failed recovery run and residual-producing jobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_RUN_ID" \
            >"$RUNNER_TEMP/prior-run.json"
          jq -e \
            --argjson run "$PRIOR_RUN_ID" \
            --argjson workflow "$PRIOR_WORKFLOW_ID" \
            --argjson repository "$REPOSITORY_ID" \
            --argjson actor "$DISPATCH_ACTOR_ID" \
            --arg control "$CONTROL_BASE_SHA" '
            .id == $run and .run_attempt == 1 and .workflow_id == $workflow and
            .path == ".github/workflows/recover-v0.1.0.yml" and
            .name == "Recover immutable v0.1.0 release" and
            .event == "workflow_dispatch" and .status == "completed" and
            .conclusion == "failure" and .head_branch == "main" and .head_sha == $control and
            .actor.id == $actor and .actor.login == "xrl" and
            .triggering_actor.id == $actor and .triggering_actor.login == "xrl" and
            .repository.id == $repository and
            .repository.full_name == "dekopon-agents/dekopon-provider-ripgrep"
          ' "$RUNNER_TEMP/prior-run.json" >/dev/null

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_RUN_ID/jobs?per_page=100" \
            >"$RUNNER_TEMP/prior-jobs.json"
          jq -e \
            --argjson preflight "$PRIOR_PREFLIGHT_JOB_ID" \
            --argjson draft "$PRIOR_DRAFT_JOB_ID" \
            --argjson publish "$PRIOR_PUBLISH_JOB_ID" \
            --argjson cleanup "$PRIOR_CLEANUP_JOB_ID" \
            --argjson finalize "$PRIOR_FINALIZE_JOB_ID" \
            --argjson verify "$PRIOR_VERIFY_FINAL_JOB_ID" '
            .total_count == 6 and (.jobs | length) == 6 and
            ([.jobs[] | {id, name, status, conclusion}] | sort_by(.id)) == ([
              {id:$preflight,
                name:"prove fixed source run, artifact, attestations, and empty destinations",
                status:"completed", conclusion:"success"},
              {id:$draft,
                name:"create a marker-owned draft from only the retained source artifact",
                status:"completed", conclusion:"success"},
              {id:$publish,
                name:"push only 0.1.0 and verify its one layer anonymously",
                status:"completed", conclusion:"failure"},
              {id:$cleanup,
                name:"delete only this run\u0027s annotation-owned manifest and marker-owned draft",
                status:"completed", conclusion:"failure"},
              {id:$finalize,
                name:"verify draft and public bytes, verify notes, then finalize as last mutation",
                status:"completed", conclusion:"skipped"},
              {id:$verify,
                name:"post-finalization anonymous read-only verification",
                status:"completed", conclusion:"skipped"}
            ] | sort_by(.id))
          ' "$RUNNER_TEMP/prior-jobs.json" >/dev/null

          verify_prior_job() {
            local id=$1 name=$2 conclusion=$3 output=$4
            gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$id" >"$output"
            jq -e --argjson id "$id" --argjson run "$PRIOR_RUN_ID" \
              --arg control "$CONTROL_BASE_SHA" --arg name "$name" \
              --arg conclusion "$conclusion" '
              .id == $id and .run_id == $run and .run_attempt == 1 and
              .head_sha == $control and .workflow_name == "Recover immutable v0.1.0 release" and
              .name == $name and .status == "completed" and .conclusion == $conclusion and
              .labels == ["ubuntu-24.04"] and
              (if $conclusion == "skipped" then
                 .runner_group_name == null and (.steps | length) == 0
               else .runner_group_name == "GitHub Actions" end)
            ' "$output" >/dev/null
          }
          verify_prior_job "$PRIOR_PREFLIGHT_JOB_ID" \
            "prove fixed source run, artifact, attestations, and empty destinations" success \
            "$RUNNER_TEMP/prior-preflight-job.json"
          verify_prior_job "$PRIOR_DRAFT_JOB_ID" \
            "create a marker-owned draft from only the retained source artifact" success \
            "$RUNNER_TEMP/prior-draft-job.json"
          verify_prior_job "$PRIOR_PUBLISH_JOB_ID" \
            "push only 0.1.0 and verify its one layer anonymously" failure \
            "$RUNNER_TEMP/prior-publish-job.json"
          verify_prior_job "$PRIOR_CLEANUP_JOB_ID" \
            "delete only this run's annotation-owned manifest and marker-owned draft" failure \
            "$RUNNER_TEMP/prior-cleanup-job.json"
          verify_prior_job "$PRIOR_FINALIZE_JOB_ID" \
            "verify draft and public bytes, verify notes, then finalize as last mutation" skipped \
            "$RUNNER_TEMP/prior-finalize-job.json"
          verify_prior_job "$PRIOR_VERIFY_FINAL_JOB_ID" \
            "post-finalization anonymous read-only verification" skipped \
            "$RUNNER_TEMP/prior-verify-job.json"

          jq -e '
            ([.steps[] | select(.conclusion == "failure") | .name]) ==
              ["Push exactly one application-wasm layer, make public, and verify anonymously"]
          ' "$RUNNER_TEMP/prior-publish-job.json" >/dev/null
          jq -e '
            ([.steps[] | select(.conclusion == "failure") | .name]) ==
              ["Preserve unrelated state; delete only exact run-owned effects"]
          ' "$RUNNER_TEMP/prior-cleanup-job.json" >/dev/null
          jq -e '
            ([.steps[] | select(.name == "Create the run-marker-owned draft and attach only source-run bytes" and
              .conclusion == "success")] | length) == 1 and
            ([.steps[] | select(.name == "Redownload both draft assets by ID and compare with source-run bytes" and
              .conclusion == "success")] | length) == 1
          ' "$RUNNER_TEMP/prior-draft-job.json" >/dev/null
      - name: Prove the exact retained source artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID" \
            >"$RUNNER_TEMP/artifact.json"
          jq -e \
            --argjson id "$SOURCE_ARTIFACT_ID" \
            --argjson size "$SOURCE_ARTIFACT_ARCHIVE_SIZE" \
            --argjson run "$SOURCE_RUN_ID" \
            --argjson repository "$REPOSITORY_ID" \
            --arg name "$SOURCE_ARTIFACT_NAME" \
            --arg digest "$SOURCE_ARTIFACT_ARCHIVE_DIGEST" \
            --arg source "$SOURCE_SHA" '
            .id == $id and .name == $name and .size_in_bytes == $size and
            .digest == $digest and .expired == false and
            (.expires_at | fromdateiso8601) > now and
            .workflow_run.id == $run and
            .workflow_run.repository_id == $repository and
            .workflow_run.head_repository_id == $repository and
            .workflow_run.head_branch == "v0.1.0" and .workflow_run.head_sha == $source
          ' "$RUNNER_TEMP/artifact.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" \
            >"$RUNNER_TEMP/artifacts.json"
          jq -e --argjson id "$SOURCE_ARTIFACT_ID" --arg name "$SOURCE_ARTIFACT_NAME" \
            --arg digest "$SOURCE_ARTIFACT_ARCHIVE_DIGEST" '
            .total_count == 1 and (.artifacts | length) == 1 and
            .artifacts[0].id == $id and .artifacts[0].name == $name and
            .artifacts[0].digest == $digest and .artifacts[0].expired == false
          ' "$RUNNER_TEMP/artifacts.json" >/dev/null
      - name: Download only the exact retained source-run artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
          github-token: ${{ github.token }}
          repository: dekopon-agents/dekopon-provider-ripgrep
          run-id: "32733258088"
      - name: Install pinned read-only validators and runtime
        shell: bash
        run: |
          set -euo pipefail
          archive="oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "$ORAS_LINUX_AMD64_SHA256  $RUNNER_TEMP/$archive" |
            sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" oras
          test "$("$RUNNER_TEMP/oras" version | awk 'NR == 1 {print $2}')" = "$ORAS_VERSION"

          rustup toolchain install "$PROVIDER_RUST_TOOLCHAIN" --profile minimal
          cargo +"$PROVIDER_RUST_TOOLCHAIN" install wasm-tools \
            --version "$WASM_TOOLS_VERSION" --locked --root "$RUNNER_TEMP/rust-tools"
          cargo +"$PROVIDER_RUST_TOOLCHAIN" install dekopon-run \
            --version "$DEKOPON_RUN_VERSION" --locked --root "$RUNNER_TEMP/rust-tools"
          test "$("$RUNNER_TEMP/rust-tools/bin/wasm-tools" --version)" = \
            "wasm-tools $WASM_TOOLS_VERSION"
          test "$("$RUNNER_TEMP/rust-tools/bin/dekopon-run" --version)" = \
            "dekopon-run $DEKOPON_RUN_VERSION"
          echo "$RUNNER_TEMP/rust-tools/bin" >>"$GITHUB_PATH"
          mkdir "$RUNNER_TEMP/anonymous-docker"
          printf '{"auths":{}}\n' >"$RUNNER_TEMP/anonymous-docker/config.json"
      - name: Verify exact component, checksum, WIT, zero imports, licenses, and behavior
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 2
          test -z "$(find dist -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          test "$(sha256sum dist/ripgrep-provider.wasm | awk '{print $1}')" = "$COMPONENT_SHA256"
          test "$(sha256sum dist/ripgrep-provider.wasm.sha256 | awk '{print $1}')" = \
            "$CHECKSUM_SHA256"
          test "$(wc -c <dist/ripgrep-provider.wasm | tr -d ' ')" = "$COMPONENT_SIZE"
          test "$(wc -c <dist/ripgrep-provider.wasm.sha256 | tr -d ' ')" = "$CHECKSUM_SIZE"
          printf '%s  ripgrep-provider.wasm\n' "$COMPONENT_SHA256" |
            cmp - dist/ripgrep-provider.wasm.sha256
          source/scripts/verify-release-assets.sh "$PWD/dist"
          wasm-tools component wit -j dist/ripgrep-provider.wasm \
            >"$RUNNER_TEMP/component-wit.json"
          source/scripts/assert-provider-wit.sh "$RUNNER_TEMP/component-wit.json"
          wasm-tools component wit dist/ripgrep-provider.wasm >"$RUNNER_TEMP/component.wit"
          if grep -Eqi 'wasi:|resolve-command|dekopon:(http|storage)' \
            "$RUNNER_TEMP/component.wit"; then
            echo "error: forbidden component WIT import or export" >&2
            exit 1
          fi
          source/scripts/assert-zero-core-imports.sh dist/ripgrep-provider.wasm
          source/scripts/embed-license-bundle.py verify \
            dist/ripgrep-provider.wasm "$GITHUB_WORKSPACE/source"

          behavior=$(dekopon-run invoke \
            --provider dist/ripgrep-provider.wasm \
            --compile-cache "$RUNNER_TEMP/dekopon-run-cache" \
