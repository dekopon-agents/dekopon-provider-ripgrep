          jq -n --rawfile body "$RUNNER_TEMP/release-notes.md" '{
            body: $body,
            name: "v0.1.0",
            prerelease: false,
            draft: false
          }' >"$RUNNER_TEMP/finalize.json"

          # This PATCH is the residual finalizer's only remote mutation.
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$DRAFT_RELEASE_ID" \
            --input "$RUNNER_TEMP/finalize.json" >"$RUNNER_TEMP/published.json"
          jq -e --argjson release "$DRAFT_RELEASE_ID" --arg marker "$PRIOR_MARKER" \
            --rawfile body "$RUNNER_TEMP/release-notes.md" '
            .id == $release and .draft == false and .prerelease == false and
            .tag_name == "v0.1.0" and .name == "v0.1.0" and
            .body == $body and (.body | startswith($marker)) and .published_at != null and
            ([.assets[].name] | sort) ==
              ["ripgrep-provider.wasm", "ripgrep-provider.wasm.sha256"]
          ' "$RUNNER_TEMP/published.json" >/dev/null

  verify_final:
    name: anonymous read-only verification after residual finalization
    needs: finalize
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: read
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out only immutable source verification scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: 8bf0ba18f9240d5924d008d09283a5cd7c879f84
          path: source
      - name: Download the exact retained source artifact again
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
          github-token: ${{ github.token }}
          repository: dekopon-agents/dekopon-provider-ripgrep
          run-id: "32733258088"
      - name: Install pinned ORAS for anonymous reads
        shell: bash
        run: |
          set -euo pipefail
          archive="oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "$ORAS_LINUX_AMD64_SHA256  $RUNNER_TEMP/$archive" |
            sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" oras
          test "$("$RUNNER_TEMP/oras" version | awk 'NR == 1 {print $2}')" = "$ORAS_VERSION"
          mkdir "$RUNNER_TEMP/anonymous-docker"
          printf '{"auths":{}}\n' >"$RUNNER_TEMP/anonymous-docker/config.json"
      - name: Verify the release and both assets anonymously
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum dist/ripgrep-provider.wasm | awk '{print $1}')" = "$COMPONENT_SHA256"
          test "$(sha256sum dist/ripgrep-provider.wasm.sha256 | awk '{print $1}')" = \
            "$CHECKSUM_SHA256"
          env -u GH_TOKEN -u GITHUB_TOKEN curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --output "$RUNNER_TEMP/anonymous-release.json"
          jq -e \
            --argjson release "$DRAFT_RELEASE_ID" \
            --argjson component_asset "$DRAFT_COMPONENT_ASSET_ID" \
            --argjson checksum_asset "$DRAFT_CHECKSUM_ASSET_ID" \
            --arg marker "$PRIOR_MARKER" \
            --arg manifest "$MANIFEST_DIGEST" \
            --arg component "$COMPONENT_DIGEST" \
            --arg checksum "$CHECKSUM_DIGEST" \
            --arg artifact "$SOURCE_ARTIFACT_ARCHIVE_DIGEST" '
            .id == $release and .draft == false and .prerelease == false and
            .tag_name == "v0.1.0" and .name == "v0.1.0" and
            ((.body // "") | startswith($marker)) and
            ((.body | indices($manifest) | length) == 1) and
            ((.body | indices($component) | length) == 1) and
            ((.body | indices($checksum) | length) == 1) and
            ((.body | indices($artifact) | length) == 1) and
            ([.assets[] | {id, name, digest}] | sort_by(.id)) == ([
              {id:$component_asset, name:"ripgrep-provider.wasm", digest:$component},
              {id:$checksum_asset, name:"ripgrep-provider.wasm.sha256", digest:$checksum}
            ] | sort_by(.id))
          ' "$RUNNER_TEMP/anonymous-release.json" >/dev/null
          jq -er .body "$RUNNER_TEMP/anonymous-release.json" >"$RUNNER_TEMP/anonymous-notes.md"
          source/scripts/embed-license-bundle.py verify-text \
            "$RUNNER_TEMP/anonymous-notes.md" "$GITHUB_WORKSPACE/source"

          mkdir "$RUNNER_TEMP/anonymous-release-assets"
          for name in ripgrep-provider.wasm ripgrep-provider.wasm.sha256; do
            url=$(jq -er --arg name "$name" '
              [.assets[] | select(.name == $name)] |
              if length == 1 then .[0].browser_download_url
              else error("anonymous asset cardinality") end
            ' "$RUNNER_TEMP/anonymous-release.json")
            env -u GH_TOKEN -u GITHUB_TOKEN curl --fail --silent --show-error --location \
              "$url" --output "$RUNNER_TEMP/anonymous-release-assets/$name"
            cmp "dist/$name" "$RUNNER_TEMP/anonymous-release-assets/$name"
          done
          test "$(find "$RUNNER_TEMP/anonymous-release-assets" -type f | wc -l)" -eq 2
      - name: Verify tag proof and exact public package read-only after finalization
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >"$RUNNER_TEMP/post-tag-ref.json"
          jq -e --arg object "$TAG_OBJECT_SHA" '
            .ref == "refs/tags/v0.1.0" and .object.type == "tag" and .object.sha == $object
          ' "$RUNNER_TEMP/post-tag-ref.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT_SHA" >"$RUNNER_TEMP/post-tag.json"
          jq -e --arg source "$SOURCE_SHA" '
            .tag == "v0.1.0" and .object.type == "commit" and .object.sha == $source and
            .message == "dekopon-provider-ripgrep v0.1.0\n"
          ' "$RUNNER_TEMP/post-tag.json" >/dev/null
          gh api /orgs/dekopon-agents/packages/container/provider-ripgrep \
            >"$RUNNER_TEMP/post-package.json"
          jq -e --argjson package "$PACKAGE_ID" --argjson repository "$REPOSITORY_ID" '
            .id == $package and .name == "provider-ripgrep" and
            .package_type == "container" and .visibility == "public" and
            .repository.id == $repository
          ' "$RUNNER_TEMP/post-package.json" >/dev/null
          gh api --paginate \
            /orgs/dekopon-agents/packages/container/provider-ripgrep/versions?per_page=100 \
            >"$RUNNER_TEMP/post-versions.jsons"
          jq -se --argjson version "$PACKAGE_VERSION_ID" --arg digest "$MANIFEST_DIGEST" '
            [.[][]] as $versions |
            ($versions | length) == 1 and $versions[0].id == $version and
            $versions[0].name == $digest and
            (($versions[0].metadata.container.tags // []) | sort) == ["0.1.0"]
          ' "$RUNNER_TEMP/post-versions.jsons" >/dev/null
      - name: Verify exact manifest and layer bytes anonymously after finalization
        shell: bash
        run: |
          set -euo pipefail
          anonymous=(env -u GH_TOKEN -u GITHUB_TOKEN \
            DOCKER_CONFIG="$RUNNER_TEMP/anonymous-docker" "$RUNNER_TEMP/oras")
          ref="$OCI_REPOSITORY:$VERSION"
          test "$("${anonymous[@]}" manifest fetch --descriptor "$ref" | jq -er .digest)" = \
            "$MANIFEST_DIGEST"
          test "$("${anonymous[@]}" manifest fetch --descriptor \
            "$OCI_REPOSITORY@$MANIFEST_DIGEST" | jq -er .digest)" = "$MANIFEST_DIGEST"
          "${anonymous[@]}" manifest fetch "$ref" >"$RUNNER_TEMP/post-tag-manifest.json"
          "${anonymous[@]}" manifest fetch "$OCI_REPOSITORY@$MANIFEST_DIGEST" \
            >"$RUNNER_TEMP/post-digest-manifest.json"
          cmp "$RUNNER_TEMP/post-tag-manifest.json" "$RUNNER_TEMP/post-digest-manifest.json"
          test "sha256:$(sha256sum "$RUNNER_TEMP/post-tag-manifest.json" | awk '{print $1}')" = \
            "$MANIFEST_DIGEST"
          test "$(wc -c <"$RUNNER_TEMP/post-tag-manifest.json" | tr -d ' ')" = "$MANIFEST_SIZE"
          jq -e --arg run "$PRIOR_RUN_ID:1" --arg source "$SOURCE_SHA" \
            --arg created "$MANIFEST_CREATED" --arg component "$COMPONENT_DIGEST" \
            --argjson size "$COMPONENT_SIZE" '
            .schemaVersion == 2 and
            .mediaType == "application/vnd.oci.image.manifest.v1+json" and
            .artifactType == "application/vnd.dekopon.provider.v1+wasm" and
            .annotations["org.dekopon.release.run"] == $run and
            .annotations["org.opencontainers.image.revision"] == $source and
            .annotations["org.opencontainers.image.created"] == $created and
            .annotations["org.dekopon.provider.capability"] == "ripgrep.search" and
            (.layers | length) == 1 and .layers[0].mediaType == "application/wasm" and
            .layers[0].digest == $component and .layers[0].size == $size and
            .layers[0].annotations["org.opencontainers.image.title"] ==
              "dist/ripgrep-provider.wasm"
          ' "$RUNNER_TEMP/post-tag-manifest.json" >/dev/null

          mkdir "$RUNNER_TEMP/post-tag-pull" "$RUNNER_TEMP/post-digest-pull"
          "${anonymous[@]}" pull "$ref" --output "$RUNNER_TEMP/post-tag-pull"
          "${anonymous[@]}" pull "$OCI_REPOSITORY@$MANIFEST_DIGEST" \
            --output "$RUNNER_TEMP/post-digest-pull"
          cmp dist/ripgrep-provider.wasm \
            "$RUNNER_TEMP/post-tag-pull/dist/ripgrep-provider.wasm"
          cmp dist/ripgrep-provider.wasm \
            "$RUNNER_TEMP/post-digest-pull/dist/ripgrep-provider.wasm"
          for forbidden in latest staging; do
            if "${anonymous[@]}" manifest fetch --descriptor "$OCI_REPOSITORY:$forbidden" \
              >/dev/null 2>"$RUNNER_TEMP/post-$forbidden.err"; then
              echo "error: forbidden $forbidden OCI tag exists after finalization" >&2
              exit 1
            fi
            grep -Eqi 'not found|manifest unknown|MANIFEST_UNKNOWN|404' \
              "$RUNNER_TEMP/post-$forbidden.err"
          done
