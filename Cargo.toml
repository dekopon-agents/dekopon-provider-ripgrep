[workspace]

[package]
name = "dekopon-ripgrep-provider"
version = "0.5.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
description = "Streaming ripgrep-compatible search over piped stdin for Dekopon"
repository = "https://github.com/dekopon-agents/dekopon-provider-ripgrep"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `clap` is the SDK's argv layer for the `rg` command word: help, version, and usage errors are
# rendered by the guest, built without `color` or `env`.
dekopon-provider-sdk = { git = "https://github.com/dekopon-agents/dekopon", rev = "765d72149ab157e1095d3dad891bdd30d83c88cf" }
clap = { version = "=4.6.6", features = ["derive"] }
schemars = "=1.2.2"
grep-matcher = { version = "=0.1.9", default-features = false }
grep-regex = { version = "=0.1.14", default-features = false }
grep-searcher = { version = "=0.1.17", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
dekopon-provider-sdk-testkit = { git = "https://github.com/dekopon-agents/dekopon", rev = "765d72149ab157e1095d3dad891bdd30d83c88cf" }
dekopon-broker-host = { git = "https://github.com/dekopon-agents/dekopon", rev = "765d72149ab157e1095d3dad891bdd30d83c88cf" }

[lints.rust]
# `deny`, not `forbid`: wit-bindgen's export glue is `unsafe` by construction and now expands in this
# crate, so `src/lib.rs` allows it on exactly the two generated modules. No handwritten `unsafe`.
unsafe_code = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"
