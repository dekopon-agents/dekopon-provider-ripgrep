[workspace]

[package]
name = "dekopon-ripgrep-provider"
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
license = "MIT OR Apache-2.0"
description = "Bounded ripgrep-compatible search over caller-supplied virtual documents for Dekopon"
repository = "https://github.com/dekopon-agents/dekopon-provider-ripgrep"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dekopon-provider-sdk = "=0.11.1"
grep-matcher = { version = "=0.1.9", default-features = false }
grep-regex = { version = "=0.1.14", default-features = false }
grep-searcher = { version = "=0.1.17", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
dekopon-provider-sdk-testkit = "=0.11.1"
# sdk-testkit 0.11.1 resolves through dekopon-broker-host 0.11.1, whose published
# lower bound is Tokio 1.49.0. Pin that compatible minimum rather than silently floating it.
tokio = { version = "=1.49.0", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"
